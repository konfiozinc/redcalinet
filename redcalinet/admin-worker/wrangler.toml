# KZ-REDCALINET-025/026 — Worker administrativo de Red CaliNet.
#
# Reemplaza a Cloud Functions (deshabilitado: el proyecto está en Spark).
# El panel estático y la API comparten el MISMO origen para no necesitar CORS.
#
# Desarrollo local (sin cuenta de Cloudflare y sin credenciales):
#   node node_modules/wrangler/bin/wrangler.js dev --port 8787 --ip 127.0.0.1
# Producción (NO ejecutado en esta misión):
#   node node_modules/wrangler/bin/wrangler.js deploy --env produccion
name = "redcalinet-admin"
main = "src/index.mjs"
compatibility_date = "2026-01-01"
# Da acceso a node:crypto, Buffer y utilidades que el schema ya usa.
compatibility_flags = ["nodejs_compat"]

# El panel compilado se sirve como estático. Solo /admin/api/* entra al Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/admin/api/*"]

# Valores NO secretos del entorno local (emuladores).
# Los secretos NUNCA se escriben aquí: van con `wrangler secret put`.
[vars]
PROYECTO_FIREBASE = "demo-redcalinet-admin"
FIREBASE_API_KEY = "demo-key"
CARPETA_MEDIA = "redcalinet/admin"
# 1 = habla con los emuladores en loopback (sin OAuth). 0 = producción.
MODO_EMULADOR = "1"
RCL_PUBLIC_ORIGIN = "http://127.0.0.1:8787"

# ---------------------------------------------------------------------------
# Entorno de producción. Solo marcadores: ningún valor real en el repositorio.
# Completar ANTES de publicar y nunca sustituir los marcadores por secretos.
# ---------------------------------------------------------------------------
[env.produccion]
name = "redcalinet-admin"
vars = { PROYECTO_FIREBASE = "red-calinet", FIREBASE_API_KEY = "AIzaSyAJ4mWGO1gdXtnsJQDveY0l6icBM_uFlSk", CARPETA_MEDIA = "redcalinet/admin", MODO_EMULADOR = "0", RCL_PUBLIC_ORIGIN = "https://redcalinet-admin.konfiozinc.workers.dev", CLOUDINARY_CLOUD_NAME = "<CLOUDINARY_CLOUD_NAME>", CLOUDINARY_API_KEY = "<CLOUDINARY_API_KEY>" }

[env.produccion.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/admin/api/*"]

# Secretos que deben existir en el entorno de producción (wrangler secret put):
#   FIREBASE_SA             JSON completo de la cuenta de servicio de `red-calinet`
#   CLOUDINARY_API_SECRET   secreto de Cloudinary (solo cuando se habilite la subida real)
