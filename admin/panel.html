<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel — Red CaliNet</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/webp" sizes="32x32" href="../assets/logo/favicon-32.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="panel.css">
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
  }
}
</script>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sidebar__marca">
      <img src="../assets/logo/logo-200.webp" width="40" height="40" alt="">
      <div><strong>Red CaliNet</strong><small>Panel de administración</small></div>
    </div>

    <button class="nav-item activo" data-vista="empresa">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20h18M5 20V10l7-5 7 5v10M9 20v-5h6v5"/></svg>
      Mi empresa
    </button>
    <button class="nav-item" data-vista="categorias">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h6v6H4zM14 6h6v6h-6zM4 16h6v4H4zM14 16h6v4h-6z"/></svg>
      Categorías
    </button>
    <button class="nav-item" data-vista="servicios">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M3 8l9-5 9 5M3 16l9 5 9-5"/></svg>
      Servicios
    </button>
    <button class="nav-item" data-vista="contacto">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Contacto y redes
    </button>

    <div class="sidebar__pie">
      <span class="rol-badge" id="rolBadge">…</span>
      <p id="usuarioNombre" style="margin-top:8px;">…</p>
      <button class="btn btn--ghost btn--sm" id="btnSalir" style="margin-top:10px;width:100%;">Cerrar sesión</button>
    </div>
  </aside>

  <main class="contenido">
    <div class="topbar">
      <h1 id="vistaTitulo">Mi empresa</h1>
      <a class="btn btn--ghost btn--salir" href="../" target="_blank" rel="noopener">Ver mi página ↗</a>
    </div>

    <section class="panel-seccion activo" data-panel="empresa">
      <div class="panel-head">
        <h2>Datos de la empresa</h2>
        <button class="btn btn--sm" id="btnGuardarEmpresa">Guardar cambios</button>
      </div>
      <div class="tarjeta"><form class="form-grid" id="formEmpresa"></form></div>
    </section>

    <section class="panel-seccion" data-panel="categorias">
      <div class="panel-head">
        <h2>Categorías</h2>
        <button class="btn btn--sm" id="btnNuevaCategoria">+ Nueva categoría</button>
      </div>
      <div class="lista" id="listaCategorias"></div>
    </section>

    <section class="panel-seccion" data-panel="servicios">
      <div class="panel-head">
        <h2>Servicios</h2>
        <button class="btn btn--sm" id="btnNuevoServicio">+ Nuevo servicio</button>
      </div>
      <div class="lista" id="listaServicios"></div>
    </section>

    <section class="panel-seccion" data-panel="contacto">
      <div class="panel-head">
        <h2>Contacto y redes</h2>
        <button class="btn btn--sm" id="btnGuardarContacto">Guardar cambios</button>
      </div>
      <div class="tarjeta"><form class="form-grid" id="formContacto"></form></div>
    </section>
  </main>
</div>

<div id="modalRoot"></div>

<script src="../firebase-config.js"></script>
<script type="module" src="panel.js"></script>
</body>
</html>
