<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso — Panel Red CaliNet</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/webp" sizes="32x32" href="../assets/logo/favicon-32.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="panel.css">
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"
  }
}
</script>
</head>
<body>
<main class="login">
  <form class="login__card" id="loginForm" novalidate>
    <div class="login__marca">
      <img src="../assets/logo/logo-200.webp" width="52" height="52" alt="">
      <div><strong>Red CaliNet</strong><small>Panel de administración</small></div>
    </div>
    <h1>Inicia sesión</h1>
    <div class="campo">
      <label for="email">Correo</label>
      <input type="email" id="email" name="email" autocomplete="username" required>
    </div>
    <div class="campo">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn--block" type="submit" id="btnEntrar">Entrar</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
</main>

<script src="../firebase-config.js"></script>
<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "firebase/auth";

const app = initializeApp(window.firebaseConfig);
const auth = getAuth(app);
const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");
const btn = document.getElementById("btnEntrar");

function aviso(t, tipo) { msg.textContent = t; msg.className = "msg " + (tipo || ""); }

onAuthStateChanged(auth, (user) => {
  if (user) location.replace("panel.html");
});

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || !password) { aviso("Escribe tu correo y contraseña.", "err"); return; }
  btn.disabled = true; btn.textContent = "Entrando…"; aviso("");
  try {
    await signInWithEmailAndPassword(auth, email, password);
    // onAuthStateChanged redirige al panel
  } catch (e) {
    btn.disabled = false; btn.textContent = "Entrar";
    const code = e.code || "";
    aviso(
      code === "auth/invalid-credential" || code === "auth/user-not-found" || code === "auth/wrong-password"
        ? "Correo o contraseña incorrectos."
        : "No se pudo iniciar sesión. Intenta de nuevo.",
      "err"
    );
  }
});
</script>
</body>
</html>
